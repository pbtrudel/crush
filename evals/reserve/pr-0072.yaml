kind: interface
why: |
  The Agent Team sidebar went blank in any session that did not spawn the members. The roster is workspace-wide (one `team.json` per data directory), but #70 scoped the section to `member.ParentID == current session`, so switching sessions hid the whole team, its statuses, and the shared task board.

  The same workspace-wide roster also stopped a session from forming its own team. The 8-member cap counted every member ever created, so four `spawn_teammate` calls in one session were rejected with `Team member limit 8 reached` even though every existing member was inactive.
prompt: |
  The Agent Team sidebar went blank in any session that did not spawn the members. The roster is workspace-wide (one `team.json` per data directory), but #70 scoped the section to `member.ParentID == current session`, so switching sessions hid the whole team, its statuses, and the shared task board.

  The same workspace-wide roster also stopped a session from forming its own team. The 8-member cap counted every member ever created, so four `spawn_teammate` calls in one session were rejected with `Team member limit 8 reached` even though every existing member was inactive.
interface: |
  Interface: `internal/agent` declares `func (c *coordinator) finishAgentRun(sessionID string, err error)`
  and `func (c *coordinator) startTeammateRun(sess session.Session, member agentteam.Member)`.
  A teammate run is registered with `agentrun.KindTeammate`, the member's name, the member's
  parent session as its parent and the running status, and `finishAgentRun` settles it as done.
  The sidebar falls back to the whole workspace roster when the current session has no
  members, an empty session id matches no member and no run, and a member or run is included
  when a chain of parent to child links reaches it from the session, so nested work counts.
  The spawn cap counts only the members that are running or provisioning, and a new member
  starts provisioning.
  A teammate session id carries the team id after the member id, so a new team never reuses
  the id an older team's member left behind.

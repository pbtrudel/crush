    - TestEstimateMessagePartTokensFallsBackForUndecodableMedia
    - TestEstimateMessagePartTokensSupportsJPEGAndGIF
    - TestEstimateToolResultContentTokensCountsMediaDimensions
  exclude: [TestCoderAgent, TestMistralTransportRewritesRequestBody]

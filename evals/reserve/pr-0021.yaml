kind: interface
why: |
  When a provider reports no token usage, the harness estimates context size from the messages. Image payloads were only measured by their metadata string, so a 1MB screenshot counted as roughly ten tokens. Vision-heavy sessions therefore under-reported context usage and auto-compaction fired far too late — or not at all.
prompt: |
  When a provider reports no token usage, the harness estimates context size from the messages. Image payloads were only measured by their metadata string, so a 1MB screenshot counted as roughly ten tokens. Vision-heavy sessions therefore under-reported context usage and auto-compaction fired far too late — or not at all.
interface: |
  Interface: `internal/agent` gains `func estimateImageDataTokens(data []byte) int64`. An image costs one token per 750 pixels of its width times its height, rounded down, clamped per image to between 85 and 16000 tokens; data that does not decode as an image costs one token per 4 bytes with no clamp, and tool-result media arrives base64-encoded and has to be decoded before its dimensions are read. The media type and the file name or text keep their separate text estimate, with no byte count added for the payload.

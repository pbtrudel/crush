why: |
  The RC status footer showed a growing "Done in X" after every turn: the
  terminal durations were recomputed from the current time on each tick, so a
  finished turn's duration kept counting up while the thread sat idle (a short
  turn displayed as "Done in 43m 33s"), and the footer kept re-editing itself
  every tick.
prompt: |
  The RC status footer showed a growing "Done in X" after every turn: the
  terminal durations were recomputed from the current time on each tick, so a
  finished turn's duration kept counting up while the thread sat idle (a short
  turn displayed as "Done in 43m 33s"), and the footer kept re-editing itself
  every tick.

  The frozen duration is the run's own elapsed time from its start to its
  terminal state, and it freezes the same way for completed, cancelled and
  failed runs (`Done in 10s`, `Cancelled after 10s`, `Failed after 10s`).

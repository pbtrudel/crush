why: |
  `/goal` and `/loop` worked when typed into the editor, but they were missing from the TUI command dialog, so they could not be discovered or selected from the menu.
prompt: |
  `/goal` and `/loop` worked when typed into the editor, but they were missing from the TUI command dialog, so they could not be discovered or selected from the menu.
interface: |
  Interface: `internal/ui/dialog` declares the message types `ActionGoal{Objective string}` and
  `ActionLoop{Task string}`, and the arguments dialog fills `Objective` from an argument with
  the id `objective` and `Task` from an argument with the id `task`.
  The system command list carries the two commands with the ids `goal` (shown as "Set Goal")
  and `loop` (shown as "Start Loop") when a session is open. Submitting the arguments dialog
  starts the goal or loop exactly as typing `/goal <objective>` or `/loop <task>` in the editor
  does, with the automation state already recorded when the handler returns.

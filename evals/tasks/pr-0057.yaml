why: |
  The sidebar's TPS_AVG mixed throughput from every model used in a session. After switching models, the average kept reflecting the previous model's speed, so it did not describe the model actually in use.
prompt: |
  The sidebar's TPS_AVG mixed throughput from every model used in a session. After switching models, the average kept reflecting the previous model's speed, so it did not describe the model actually in use.
interface: |
  Interface: `internal/ui/model` declares `func (m *UI) resetTPS()`.
  A reset clears the live rate with its message id, start time, byte count and token count,
  and clears both the session's output and duration totals.
  The session average is seeded only from the steps whose provider and model match the last
  finished, non-summary assistant message, so steps from an earlier model and summary steps
  are left out.

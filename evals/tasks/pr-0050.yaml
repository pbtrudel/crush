why: |
  PR #49 added a streaming repetition guard and sidebar TPS stats, but testing the merged code found two gaps: a degenerate response that inserts a space between repeated characters (for example a CJK character repeated every 57 characters) was not stopped, and reasoning output was never inspected. The TPS stat also disappeared when idle, and the long `LIVE_TPS` / `TOTAL_AVG_FOR_SESSION` labels were hard to scan.

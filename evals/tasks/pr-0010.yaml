why: >
  Every launch of a fork build shows `Crush update available: v0.98.1-fork.10 → v0.98.1`,
  even though the binary already contains the latest upstream release. The version comparison
  treats the `-fork.N` build suffix as a pre-release, so the fork always looks older than the
  upstream tag it was cut from.

why: |
  `/btw` in Discord (and the TUI side-question dialog) renders `(the model
  returned no answer)` whenever the provider ends a response without any text.
  The ephemeral side-question path ignored the finish reason and logged
  nothing, so every such stop was indistinguishable from a real answer and
  could not be diagnosed.
prompt: |
  `/btw` in Discord (and the TUI side-question dialog) renders `(the model
  returned no answer)` whenever the provider ends a response without any text.
  The ephemeral side-question path ignored the finish reason and logged
  nothing, so every such stop was indistinguishable from a real answer and
  could not be diagnosed.

  An answer that comes back with no text is an error rather than an empty
  answer: the error names the finish reason as `finish_reason=<reason>`
  (`stop`, `length` or `error`) and says there was no answer.

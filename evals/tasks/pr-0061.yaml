why: |
  `/btw` (Side Question) stopped producing answers: the dialog showed
  "(the model returned no answer)" in both the TUI and Discord.

  The ephemeral side-question call reused the coding-agent system prompt but
  registered no tools. That prompt instructs the model to inspect the
  workspace, run commands, and keep working until the task is done, so the
  model answered with a promise to go look at files ("I'll look at the project
  files to find how to run it.") or with a completely empty message. The empty
  case is what the UI reports as no answer.

  Reproduced against a live Mistral endpoint with the real coder prompt: 3 of 5
  runs returned an empty message with `finish_reason: stop`.

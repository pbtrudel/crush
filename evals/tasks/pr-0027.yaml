  - cost accounting billed cached reads at the full input price (for DeepSeek v4 Flash's cached portion, a ~50x overcharge), and
  - the sidebar's cached-share badge never appeared (it is hidden at 0), making the cache hit rate on the most-used models invisible.

  This matters most for DeepSeek and Z.AI users, whose prompt caching is automatic: there is nothing request-side left to tune, so surfacing the numbers is the only remaining lever.
interface: |
  Interface: `internal/agent` declares `func cacheAwareUsage(response openaisdk.ChatCompletion) (fantasy.Usage, fantasy.ProviderOptionsData)`
  and `func cacheAwareStreamUsage(chunk openaisdk.ChatCompletionChunk, ctx map[string]any, metadata fantasy.ProviderMetadata) (fantasy.Usage, fantasy.ProviderMetadata)`,
  where `openaisdk` is `github.com/charmbracelet/openai-go` and the fantasy types come from
  `charm.land/fantasy`.
  The adopted cache-read count is subtracted from the uncached input, so that input plus
  cache_read equals the provider's prompt_tokens, and the standard field wins whenever it is
  present, even as an explicit 0.

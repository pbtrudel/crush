kind: interface
why: |
  OpenAI-compatible providers report prompt-cache hits in different usage shapes, and crush could only read one of them. fantasy's default extraction understands `prompt_tokens_details.cached_tokens` (OpenAI and gateways that normalize to it), but DeepSeek reports `prompt_cache_hit_tokens` and Kimi/Moonshot report a top-level `cached_tokens`. On those providers the cache reads stayed folded into the input tokens, so:

  - cost accounting billed cached reads at the full input price (for DeepSeek v4 Flash's cached portion, a ~50x overcharge), and
  - the sidebar's cached-share badge never appeared (it is hidden at 0), making the cache hit rate on the most-used models invisible.

  This matters most for DeepSeek and Z.AI users, whose prompt caching is automatic: there is nothing request-side left to tune, so surfacing the numbers is the only remaining lever.

kind: interface
why: |
  Subagents cannot use MCP servers. A delegated task runs on the task preset, which carried `allowed_mcp: {}` — an empty allow-list that means "no MCP servers" — and a hand-picked read-only tool list. The read-write variant copied the coder's tools but kept that empty MCP list, so no subagent could call any MCP tool the Lead could. The same preset also lacked `fetch`, `download`, `todos`, the job tools, `crush_info`/`crush_logs`, LSP diagnostics/references, and the MCP resource tools.

  The practical effect: a subagent told to use Tavily, Semgrep, ClickUp, or any other configured server could not, and had to hand the work back to the Lead.
prompt: |
  Subagents cannot use MCP servers. A delegated task runs on the task preset, which carried `allowed_mcp: {}` — an empty allow-list that means "no MCP servers" — and a hand-picked read-only tool list. The read-write variant copied the coder's tools but kept that empty MCP list, so no subagent could call any MCP tool the Lead could. The same preset also lacked `fetch`, `download`, `todos`, the job tools, `crush_info`/`crush_logs`, LSP diagnostics/references, and the MCP resource tools.

  The practical effect: a subagent told to use Tavily, Semgrep, ClickUp, or any other configured server could not, and had to hand the work back to the Lead.
interface: |
  Interface: `internal/config` declares `func resolveSubAgentTools(tools []string) []string`.
  The task preset's tool list is the coder's list in the coder's order minus the delegation
  tools (`agent`, `agent_dispatch`, `agent_send`, `agent_status`, `agent_stop`,
  `agentic_fetch`), the interactive and team tools (`question`, `spawn_teammate`,
  `send_message`, `list_agents`, `wait_agent`, `interrupt_agent`, `team_task_create`,
  `team_task_list`, `team_task_get`, `team_task_update`) and the file-editing tools (`edit`,
  `multiedit`, `write`, `lsp_rename`, `lsp_replace_symbol`, `worktree`).
  The task preset's MCP allow-list is nil rather than an empty map, so a subagent uses every
  MCP server its coder uses, and the read-write variant takes the coder's allow-list as it is.

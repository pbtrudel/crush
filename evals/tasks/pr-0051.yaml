why: >
  Completed background shells are reaped when the 50-job cap is hit. A `job_kill` call that
  arrives after completion then failed with `background shell not found`, which surfaced as a
  red error in the transcript even though there was nothing left to stop.
prompt: >
  Completed background shells are reaped when the 50-job cap is hit. A `job_kill` call that
  arrives after completion then failed with `background shell not found`, which surfaced as a
  red error in the transcript even though there was nothing left to stop.
interface: >
  Interface: `internal/shell` declares the package-level variable
  `var ErrBackgroundShellNotFound = errors.New("background shell not found")`, which callers
  test for with `errors.Is`. A kill of a shell that is already gone returns a response that
  says the shell is not running. `BackgroundShellManager.Kill` (and `Remove`) of an unknown id
  returns an error that wraps it.

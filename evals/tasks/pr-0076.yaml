kind: interface
why: |
  Users see `background shell not found: <id>` repeatedly. Two code paths promise the model a job ID and then delete it:

  - Every **foreground** bash command published a background-completion notice ("Background job X finished… use job_output with shell_id=X") and was immediately removed from the job map, so that instruction was always a dead end.
  - A `run_in_background` command that finished inside the 1s fast-failure probe was removed the same way, even though its notice had already gone out.

  Because job IDs also restart at 1 in each process, stale IDs from a resumed session hit the same error, and it surfaced as a failed tool call with a `×` in the UI.

interface: |
  Interface: `internal/shell` declares `func (bs *BackgroundShell) SetSessionID(sessionID string)`
  on `*BackgroundShell`, which attaches the owning session to a job that outlived its
  foreground window.
  The bash tool's response metadata carries the job id in a `ShellID` field.
  `job_output` answers an id the manager no longer tracks with a non-error text that contains
  the words `no longer tracked` and says its output is gone.
  A job with no owning session publishes no completion notice, and a job whose session is
  attached before it finishes publishes one for that session.

why: |
  `config.Load` and provider resolution log through slog while the config is being loaded — but the log file path is itself derived from that config, so the file logger cannot exist yet. Those early records were discarded with `slog.DiscardHandler` in `Execute`, which hid exactly the diagnostics users and support need when a provider is misconfigured: a failing setup ran with an empty log file.
prompt: |
  `config.Load` and provider resolution log through slog while the config is being loaded — but the log file path is itself derived from that config, so the file logger cannot exist yet. Those early records were discarded with `slog.DiscardHandler` in `Execute`, which hid exactly the diagnostics users and support need when a provider is misconfigured: a failing setup ran with an empty log file.
interface: |
  Interface: `internal/log` declares `func newBufferHandler() *bufferHandler`, and the
  returned `*bufferHandler` implements `slog.Handler` with `Enabled(context.Context, slog.Level) bool`,
  `Handle(context.Context, slog.Record) error`, `WithAttrs([]slog.Attr) slog.Handler` and
  `WithGroup(string) slog.Handler`; it also has the method `replay(l *slog.Logger)`.
  A replay writes each buffered record to the target logger's handler only when that handler
  is enabled for the record's level, empties the buffer so that a second replay writes
  nothing, and keeps the attributes added before a `WithGroup` call unprefixed while the ones
  added after it carry the group name, a dot and their key.

why: |
  When switching models, `ctrl+r` cycles the reasoning effort before Enter. The picker read those levels from the provider catalog, which can lag behind the configured provider model (for example a model synced with low/high/max while the catalog still says low/medium/high). The picker then offered levels that do not exist and omitted real ones, disagreeing with Select Reasoning Effort, which reads the configured model.
prompt: |
  When switching models, `ctrl+r` cycles the reasoning effort before Enter. The picker read those levels from the provider catalog, which can lag behind the configured provider model (for example a model synced with low/high/max while the catalog still says low/medium/high). The picker then offered levels that do not exist and omitted real ones, disagreeing with Select Reasoning Effort, which reads the configured model.

  The picker offers the configured model's effort levels in its configured order and selects its configured default effort level.

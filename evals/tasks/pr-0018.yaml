kind: interface
why: |
  The bash tool skips the permission prompt for commands it classifies as read-only, but that classification missed file redirection: `ls > ~/.bashrc` or `cat notes >> ~/.ssh/authorized_keys` executed without approval, so a prompt-injected model could overwrite arbitrary files. Several allowlisted entries were also not read-only: `env`/`printenv` dump credentials to the model, `kill`/`killall` are destructive, and `timeout`/`nohup`/`nice`/`time` execute arbitrary child commands that bypass the prefix check entirely. Review additionally found that `git diff --output=<file>` truncates a file with no shell metacharacter at all.
prompt: |
  The bash tool skips the permission prompt for commands it classifies as read-only, but that classification missed file redirection: `ls > ~/.bashrc` or `cat notes >> ~/.ssh/authorized_keys` executed without approval, so a prompt-injected model could overwrite arbitrary files. Several allowlisted entries were also not read-only: `env`/`printenv` dump credentials to the model, `kill`/`killall` are destructive, and `timeout`/`nohup`/`nice`/`time` execute arbitrary child commands that bypass the prefix check entirely. Review additionally found that `git diff --output=<file>` truncates a file with no shell metacharacter at all.
interface: |
  Interface: `internal/agent/tools` gains `func isSafeReadOnlyCommand(cmd string) bool`, which reports whether a command may run without a permission prompt. Besides the commands the problem names, `set`, `unset` and the `git branch`, `git tag` and `git remote` subcommands leave the allow list, as do the git flags `--output`, `--ext-diff` and `-O`/`--open-files-in-pager`; a command prefix still only matches at a word boundary, so `lsof` is not `ls`. Input redirection `<`, a background `&`, the redirects `&>` and `>&`, and a newline count as command chaining.

kind: interface
why: |
  The `/rc` command (Discord remote control, added in #9) never appears in the `/` command palette on a fresh launch. The palette entry is gated on an active session, but Crush creates the session lazily on the first prompt, so before you send any message the command is invisible and cannot be discovered or run.
prompt: |
  The `/rc` command (Discord remote control, added in #9) never appears in the `/` command palette on a fresh launch. The palette entry is gated on an active session, but Crush creates the session lazily on the first prompt, so before you send any message the command is invisible and cannot be discovered or run.
interface: |
  Interface: `internal/ui/model` gains `func (m *UI) toggleRemoteControl() []tea.Cmd`, where `tea` is the existing import alias for `charm.land/bubbletea/v2`. The palette entry keeps its id `remote_control` and is listed by the dialog's default commands whether or not a session exists. With no active session the method creates exactly one session through the workspace and returns the commands that load it and start the bridge.

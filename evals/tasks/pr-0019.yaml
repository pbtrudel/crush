kind: interface
why: |
  When a provider rejects a request because it exceeds the model's context window, the turn failed outright and the user lost mid-task work. The existing guards only run after each step and between turns, so a single step with several large tool outputs can overshoot between checks; models with an unknown context window (`ContextWindow == 0`, e.g. custom/local providers) had no protection at all and grew until the provider errored.
prompt: |
  When a provider rejects a request because it exceeds the model's context window, the turn failed outright and the user lost mid-task work. The existing guards only run after each step and between turns, so a single step with several large tool outputs can overshoot between checks; models with an unknown context window (`ContextWindow == 0`, e.g. custom/local providers) had no protection at all and grew until the provider errored.
interface: |
  Interface: `internal/agent` gains `func isContextOverflowError(err error) bool` and `func shouldRecoverFromOverflow(err error, retried bool) bool`. An overflow is recognised only through fantasy's structured provider error, `ProviderError.ContextTooLargeErr` or a non-zero `ProviderError.ContextMaxTokens`, never from a message string such as `prompt is too long`; recovery is allowed on a first attempt and refused once the call was retried or the error is not an overflow.

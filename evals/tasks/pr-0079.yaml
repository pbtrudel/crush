why: |
  Teammates kept ending their turns without editing anything. The Lead in the
  other session had to stop four of them and write the changes itself.

  The cause is in `teamRunner.teammateAgent`: it built the teammate agent into
  the coordinator's readiness group and returned immediately, so `Start`
  launched the turn before `SetTools` had run. The request went out with an
  empty tool palette, and a model with no tools can only narrate what it is
  about to do and stop.

  The evidence is in the session database. Stalled teammate sessions contain
  exactly that:

  | session | messages | assistant turn |
  |---|---|---|
  | `team-member-9` | 4 | "I'll start by reading the task specification." — no tool calls |
  | `team-member-7` | 4 | same, then after the Lead's nudge, "I'll start by reading the task specification and claiming it." — again no tool calls |
  | `team-member-6` | 4 | same |
  | `team-member-8` | 654 | completed the work |

  Nine teammate sessions in that workspace, five with six messages or fewer.
  It looked intermittent because it was a race between the palette build and
  the first request: whichever finished first decided whether the teammate
  could act.

  A probe test that builds a teammate through the production path and reads
  its palette failed 10 out of 10 runs before this change.

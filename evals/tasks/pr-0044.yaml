why: |
  Three shell-command restrictions got in the way in practice:

  - Completed background shells stayed tracked for eight hours so their output remained readable, and counted toward the hard 50-job cap the entire time. Sessions therefore hit `maximum number of background jobs (50) reached` even when nothing was running.
  - YOLO mode skips permission prompts, but the shell still rejected `sudo` as a banned command, so the mode could not run administrative commands.
  - Every package install, including `go install`, was blocked, so the agent could not install the tooling it needed.
prompt: |
  Three shell-command restrictions got in the way in practice:

  - Completed background shells stayed tracked for eight hours so their output remained readable, and counted toward the hard 50-job cap the entire time. Sessions therefore hit `maximum number of background jobs (50) reached` even when nothing was running.
  - YOLO mode skips permission prompts, but the shell still rejected `sudo` as a banned command, so the mode could not run administrative commands.
  - Every package install, including `go install`, was blocked, so the agent could not install the tooling it needed.
interface: |
  Interface: `internal/agent/tools` declares `func blockFuncs(yolo bool) []shell.BlockFunc`.
  Starting a job reaps the completed jobs when the cap is already reached: a completed job
  still counts toward the cap and stays listed until a start reclaims it.
  Every package-install command leaves the block list, among them `apk add`, `apt install`,
  `apt-get install`, `dnf install`, `pacman -S`, `pkg install`, `yum install`, `zypper install`,
  `brew install`, `cargo install`, `gem install`, `go install`, `npm install --global`,
  `npm install -g`, `pip install --user`, `pip3 install --user`, `pnpm add --global`,
  `pnpm add -g` and `yarn global add`, while `go test -exec` stays blocked.
  `sudo` is blocked unless permission requests are skipped, and `su`, `doas` and the
  system-modification commands stay blocked in YOLO mode too.

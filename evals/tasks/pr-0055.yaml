kind: plain
why: |
  Switching models mid-session left the sidebar (and the landing view, and
  remote clients' agent info) showing the previously selected model, even
  though new requests were already going to the new one. The only way to see
  the real selection was to restart Crush.

  Root cause: agents read models lazily from the coordinator's shared model set
  at request time, but `UpdateModels` only rebuilt that set; it never pushed
  the rebuilt pair into the live agent. `Coordinator.Model()` reports the
  agent's own copy, which was seeded once at construction, and that is what the
  UI renders.

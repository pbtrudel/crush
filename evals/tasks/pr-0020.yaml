why: |
  UI-initiated workspace operations ran on `context.TODO()` or `context.Background()` with no deadline: session list/delete/save, model switches, MCP toggles, session open, prompt-history and skills loads. Against a stalled backend (especially the client/server mode where these cross a network) the UI simply waited forever — the sessions dialog never rendered, an MCP toggle silently did nothing.
prompt: |
  UI-initiated workspace operations ran on `context.TODO()` or `context.Background()` with no deadline: session list/delete/save, model switches, MCP toggles, session open, prompt-history and skills loads. Against a stalled backend (especially the client/server mode where these cross a network) the UI simply waited forever — the sessions dialog never rendered, an MCP toggle silently did nothing.
interface: |
  Interface: `internal/ui/common` declares `const WorkspaceOpTimeout = 30 * time.Second`, a `time.Duration`, and `func WorkspaceOpContext() (context.Context, context.CancelFunc)`, which returns a live context whose deadline is that timeout and a cancel function that cancels it.

why: |
  `/compact` in the Discord remote-control thread failed with **"The application
  did not respond"**. Commit 9fa5f7cb moved every gateway interaction onto a
  dedicated queue so button presses could be acknowledged inside Discord's
  3-second window, but the new `interactionLoop` only handled `MESSAGE_COMPONENT`
  (3) and `MODAL_SUBMIT` (5). Application commands (type 2) — every native slash
  command, including `/compact`, `/status`, `/model` — were received and
  silently dropped, so no interaction callback was ever sent.

why: |
  `/btw` fails on long agentic sessions with "the model returned no answer
  (finish_reason=stop)". The project log records the reason, but not the cause:

  ```
  WARN "Side question returned no text" finish_reason=stop provider=mistral model=deepseek-v4-1-flash-1017
  ```

  Replaying a real failing session (727 messages, ~148k tokens) against the same
  provider shows what happens. The side question replays the whole transcript,
  which is made of tool turns, so the model answers by calling a tool. The
  ephemeral agent deliberately declares no tools, so the provider drops the call
  and returns an empty message with a normal stop reason. Short sessions answer
  fine, which is why this only bites after a long working session.

  | request | result |
  | --- | --- |
  | full history, no tools (what `/btw` sends) | `finish=stop`, empty content |
  | same history, tools declared | model returns a tool call |
  | last 10 messages only | answers normally |
  | full history + "Do not call any tools" | answers correctly |
prompt: |
  `/btw` fails on long agentic sessions with "the model returned no answer
  (finish_reason=stop)". The project log records the reason, but not the cause:

  ```
  WARN "Side question returned no text" finish_reason=stop provider=mistral model=deepseek-v4-1-flash-1017
  ```

  Replaying a real failing session (727 messages, ~148k tokens) against the same
  provider shows what happens. The side question replays the whole transcript,
  which is made of tool turns, so the model answers by calling a tool. The
  ephemeral agent deliberately declares no tools, so the provider drops the call
  and returns an empty message with a normal stop reason. Short sessions answer
  fine, which is why this only bites after a long working session.

  | request | result |
  | --- | --- |
  | full history, no tools (what `/btw` sends) | `finish=stop`, empty content |
  | same history, tools declared | model returns a tool call |
  | last 10 messages only | answers normally |
  | full history + "Do not call any tools" | answers correctly |

  An empty answer is retried exactly once, with the same question plus
  `Do not call any tools.` in the request; an answer still empty after the
  retry is an error that names the finish reason as `finish_reason=<reason>`
  and says there was no answer.

name: build
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # setup-go caches GOCACHE/GOMODCACHE by default; cache: true makes it
      # explicit so the intent survives future action upgrades.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod tidy
      - run: git diff --exit-code
      - run: go build -race ./...
      # Single full-suite run per OS: on Linux it also collects the coverage
      # profile for the floor check below, so CI never runs the whole suite
      # twice.
      - run: go test -race -failfast -covermode=atomic -coverprofile=coverage.out ./...
        if: runner.os == 'Linux'
      - run: go test -race -failfast ./...
        if: runner.os != 'Linux'
      - name: Enforce coverage floor
        if: runner.os == 'Linux'
        env:
          COVERAGE_FLOOR: "60"
        run: |
          total="$(go tool cover -func=coverage.out | awk '/^total:/ {print $3}')"
          pct="${total%\%}"
          echo "### Total coverage: $total (floor: ${COVERAGE_FLOOR}%)" >> "$GITHUB_STEP_SUMMARY"
          awk -v c="$pct" -v t="$COVERAGE_FLOOR" 'BEGIN { exit (c + 0 >= t + 0) ? 0 : 1 }' || {
            echo "Coverage $total is below the ${COVERAGE_FLOOR}% floor" >&2
            exit 1
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: runner.os == 'Linux'
        with:
          name: coverage
          path: coverage.out

name: build
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # setup-go caches GOCACHE/GOMODCACHE by default; cache: true makes it
      # explicit so the intent survives future action upgrades.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod tidy
      - run: git diff --exit-code
      - run: go build -race ./...
      - run: go test -race -failfast -covermode=atomic -coverprofile=coverage.out ./...
      # Coverage floor: the whole suite must never drop below the measured
      # baseline (62.2% when this gate was introduced). Raise it deliberately
      # as coverage improves; never lower it to make a change pass.
      - name: Enforce coverage floor
        env:
          COVERAGE_FLOOR: "60"
        run: |
          total="$(go tool cover -func=coverage.out | awk '/^total:/ {print $3}')"
          pct="${total%\%}"
          echo "### Total coverage: $total (floor: ${COVERAGE_FLOOR}%)" >> "$GITHUB_STEP_SUMMARY"
          awk -v c="$pct" -v t="$COVERAGE_FLOOR" 'BEGIN { exit (c + 0 >= t + 0) ? 0 : 1 }' || {
            echo "Coverage $total is below the ${COVERAGE_FLOOR}% floor" >&2
            exit 1
          }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage.out

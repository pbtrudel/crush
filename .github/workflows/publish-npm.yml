# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: publish npm

# Publishes the fork's npm package (@conanmontreal/crush) on every merge to
# the default branch: tags the commit as v<upstream-tag>-fork.<run-number>,
# cross-compiles the binaries, archives them goreleaser-style, publishes the
# archives to a GitHub release and stages the npm wrapper package with
# `npm stage publish` (no 2FA in CI; a maintainer approves the staged package
# later with 2FA). The postinstall downloads the right archive from that
# release.
#
# goreleaser itself is not used: its npm publisher (npms) is Pro-only, and a
# single-job shell pipeline is faster than the equivalent goreleaser run.

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-npm
  cancel-in-progress: false

env:
  NPM_PACKAGE: "@conanmontreal/crush"
  RELEASE_REPO: "pbtrudel/crush"

jobs:
  publish:
    # Pinned to 26.04: ubuntu-latest migrates to Ubuntu 26 on 2026-10-19
    # (runner-images#14748); opting in explicitly keeps runs predictable.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Compute version and create tag
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          # Base version: the latest stable upstream release tag, read from
          # charmbracelet/crush without importing tags (importing them would
          # make the tag's own checkout of upstream workflows fire). Fall back
          # to local tags, then 0.0.0. The run number makes every build unique
          # so npm never sees a duplicate version.
          base="$(git ls-remote --tags --refs --sort='-v:refname' \
            https://github.com/charmbracelet/crush.git 'v*' \
            | awk -F'refs/tags/' '$2 ~ /^v[0-9]+\.[0-9]+\.[0-9]+$/ {print $2; exit}' \
            | sed 's/^v//;s/+.*$//')"
          if [ -z "$base" ]; then
            base="$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//;s/+.*$//' || true)"
          fi
          if [ -z "$base" ]; then base="0.0.0"; fi
          version="${base}-fork.${RUN_NUMBER}"
          git tag "v${version}"
          # Force-push so a re-run of the same workflow run re-publishes the
          # same version instead of failing on the existing tag.
          git push -f origin "v${version}"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "Publishing ${NPM_PACKAGE}@${version}"

      - name: Build all platforms
        env:
          VERSION: ${{ env.VERSION }}
        run: |
          set -e
          go mod download
          echo "==> building linux/amd64"
          export CGO_ENABLED=0 GOEXPERIMENT=greenteagc GOOS=linux GOARCH=amd64
          go build -buildvcs=false -trimpath \
            -ldflags "-s -w -X github.com/charmbracelet/crush/internal/version.Version=${VERSION}" \
            -o dist/bin/crush .
          echo "==> built linux/amd64"
          ls -la dist/bin/

      - name: Archive and checksum
        env:
          VERSION: ${{ env.VERSION }}
        run: |
          set -e
          # Completions and man pages are generated from the built binary.
          mkdir -p completions manpages dist
          ./dist/bin/crush completion bash >completions/crush.bash
          ./dist/bin/crush completion zsh >completions/crush.zsh
          ./dist/bin/crush completion fish >completions/crush.fish
          ./dist/bin/crush man | gzip -c >manpages/crush.1.gz
          base="crush_${VERSION}_Linux_x86_64"
          mkdir -p "dist/stage/${base}"
          cp dist/bin/crush "dist/stage/${base}/"
          cp README.md LICENSE.md "dist/stage/${base}/"
          cp -r completions manpages "dist/stage/${base}/"
          (
            cd dist/stage
            tar -czf "../${base}.tar.gz" "$base"
          )
          rm -rf dist/stage dist/bin
          (cd dist && sha256sum -- *.tar.gz > checksums.txt)
          ls -la dist/

      - name: Create GitHub release
        env:
          VERSION: ${{ env.VERSION }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${VERSION}" dist/* \
            --repo "$RELEASE_REPO" \
            --title "v${VERSION}" \
            --notes "Fork build ${VERSION} (see the fork README for what it changes over upstream)."

      - name: Generate npm package.json
        env:
          VERSION: ${{ env.VERSION }}
        run: |
          node <<'EOF'
          const fs = require("fs");

          const version = process.env.VERSION;
          const npmPackage = process.env.NPM_PACKAGE;
          const releaseRepo = process.env.RELEASE_REPO;
          const baseURL = `https://github.com/${releaseRepo}/releases/download/v${version}`;

          const checksums = {};
          for (const line of fs.readFileSync("dist/checksums.txt", "utf8").trim().split("\n")) {
            const [digest, name] = line.trim().split(/\s+/);
            checksums[name] = digest;
          }

          // Keys must match `${process.platform}-${process.arch}` as read by
          // lib.js. Fork builds are Linux x86_64 only; installs on other
          // platforms fail loudly with "No archive available".
          const targets = [
            ["linux-x64", "linux", "amd64", "Linux", "x86_64", "tar.gz", "crush"],
          ];

          const archives = {};
          for (const [key, goos, goarch, osTitle, archTitle, format, bin] of targets) {
            const base = `crush_${version}_${osTitle}_${archTitle}`;
            const name = `${base}.${format}`;
            archives[key] = {
              name,
              url: `${baseURL}/${name}`,
              bins: [bin],
              format,
              checksum: { algorithm: "sha256", digest: checksums[name] },
              wrappedIn: base,
            };
          }

          const pkg = {
            name: npmPackage,
            type: "module",
            version,
            description: "A powerful terminal-based AI assistant for developers, providing intelligent coding assistance directly in your terminal. (pbtrudel fork with local patches)",
            scripts: {
              postinstall: "node install.js",
              run: "node run-crush.js",
            },
            repository: {
              type: "git",
              url: `git+https://github.com/${releaseRepo}.git`,
            },
            license: "FSL-1.1-MIT",
            // Scoped packages default to restricted; publishing to npmjs must
            // be public; the dist-tag is passed on the npm stage publish line.
            publishConfig: { access: "public" },
            bugs: { url: `https://github.com/${releaseRepo}/issues` },
            homepage: `https://github.com/${releaseRepo}#readme`,
            bin: { crush: "run-crush.js" },
            files: ["*.js"],
            dependencies: {
              jszip: "3.10.2",
              "proxy-agent": "8.0.2",
              tar: "7.5.22",
            },
            archives,
          };

          fs.writeFileSync("npm/package.json", JSON.stringify(pkg, null, 2) + "\n");
          console.log("generated npm/package.json for", npmPackage, version);
          EOF
          node --check npm/lib.js && node --check npm/install.js && node --check npm/run-crush.js

      # NPM_KEY can only stage, not publish; a maintainer approves the staged
      # package on npm with 2FA afterwards.
      - name: Stage package for maintainer approval
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_KEY }}
        run: |
          cd npm
          npm stage publish --tag latest

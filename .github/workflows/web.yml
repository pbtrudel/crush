name: web
on:
  pull_request:
    paths: ['web/**', 'internal/web/**', 'internal/wire/**', '.github/workflows/web.yml']
  push:
    branches: [main]
    paths: ['web/**', 'internal/web/**', 'internal/wire/**', '.github/workflows/web.yml']

permissions:
  contents: read

concurrency:
  group: web-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run typecheck && npm test
        working-directory: web
      - name: Committed build is fresh
        run: |
          npm --prefix web run build
          git diff --exit-code -- internal/web/dist
          stray=$(git status --porcelain --untracked-files=all -- internal/web/dist)
          if [ -n "$stray" ]; then
            echo "$stray"
            echo "internal/web/dist has files the commit does not carry"
            exit 1
          fi
      - run: go test ./internal/web/... ./internal/wire/...
      - run: npx playwright install --with-deps chromium && npm run e2e
        working-directory: web
      # The screenshot comparison is a diff against a baseline, so a failure
      # without the actual/expected/diff images tells nobody why. Upload what
      # Playwright wrote: traces and screenshots land in test-results, and the
      # HTML report when the reporter writes one.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-results
          path: |
            web/test-results
            web/playwright-report
          if-no-files-found: ignore

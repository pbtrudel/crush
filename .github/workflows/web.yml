name: web
on:
  pull_request:
    paths: ['web/**', 'internal/web/**', 'internal/wire/**', '.github/workflows/web.yml']
  push:
    branches: [main]
    paths: ['web/**', 'internal/web/**', 'internal/wire/**']

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run typecheck && npm test
        working-directory: web
      - name: Committed build is fresh
        run: |
          npm --prefix web run build
          git diff --exit-code -- internal/web/dist
      - run: go test ./internal/web/... ./internal/wire/...
      - run: npx playwright install --with-deps chromium && npm run e2e
        working-directory: web
